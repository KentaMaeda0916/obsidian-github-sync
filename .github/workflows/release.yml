# BRAT はデフォルトブランチではなくリリースアセットからしか読まないため、
# ビルドしてリリースを作るところまで自動化する。
#
# タグを push する経路と、手動実行（workflow_dispatch）の両方に対応する。
# 手動実行のときはタグ名を manifest.json の version から決め、リリース作成時に
# タグごと作る。タグを push できない環境からでもリリースを切れるようにするため。
name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: リリースするバージョンを決める
        id: version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$MANIFEST_VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "manifest.json は $MANIFEST_VERSION、タグは $GITHUB_REF_NAME で食い違っています" >&2
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: リリースを作る（既にあればアセットを差し替える）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
